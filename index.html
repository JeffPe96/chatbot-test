<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Chatbot Widget</title>
<style>
/* ── PAGE DE TEST ── */
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: #f0f0f0;
  margin: 0;
  padding: 40px;
  min-height: 100vh;
}
.test-page {
  max-width: 800px;
  margin: 0 auto;
  background: white;
  border-radius: 16px;
  padding: 40px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
}
.test-page h1 { font-size: 28px; margin-bottom: 8px; }
.test-page p { color: #666; line-height: 1.6; }

/* ── WIDGET ── */
:root {
  --cyan: #00e5c8;
  --dark: #0d1117;
  --bg2: #141920;
  --bg3: #1a2030;
  --bg4: #212840;
  --border: rgba(255,255,255,0.08);
  --muted: #6b7280;
  --white: #e8edf5;
  --red: #ff5564;
  --green: #00d48c;
}

#chatBtn {
  position: fixed;
  bottom: 28px;
  right: 28px;
  width: 60px;
  height: 60px;
  background: var(--cyan);
  border: none;
  border-radius: 50%;
  cursor: pointer;
  box-shadow: 0 4px 24px rgba(0,229,200,0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  transition: transform .2s, box-shadow .2s;
  z-index: 1000;
}
#chatBtn:hover { transform: scale(1.08); }
#chatBtn.open { background: #ff5564; }

#chatBadge {
  position: fixed;
  bottom: 76px;
  right: 28px;
  background: var(--red);
  color: white;
  font-size: 10px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 10px;
  z-index: 1001;
  display: none;
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }

#chatWindow {
  position: fixed;
  bottom: 100px;
  right: 28px;
  width: 370px;
  height: min(560px, calc(100vh - 140px));
  background: var(--dark);
  border: 1px solid var(--border);
  border-radius: 20px;
  display: none;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 8px 40px rgba(0,0,0,0.4);
  z-index: 999;
  animation: slideUp .25s ease;
}
@keyframes slideUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
#chatWindow.open { display: flex; }

.chat-header {
  background: var(--bg2);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.chat-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--cyan), #0099cc);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}
.chat-header-info { flex: 1 }
.chat-name { font-size: 13px; font-weight: 700; color: var(--white) }
.chat-status { font-size: 11px; color: var(--cyan); display: flex; align-items: center; gap: 4px }
.chat-status::before { content:''; width:6px; height:6px; background:var(--cyan); border-radius:50%; display:inline-block }
.chat-close { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px; padding: 4px; }
.chat-close:hover { color: var(--white) }

.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  scroll-behavior: smooth;
}
.chat-messages::-webkit-scrollbar { width: 4px }
.chat-messages::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 2px }

.msg { display: flex; gap: 8px; animation: msgIn .2s ease; }
@keyframes msgIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
.msg.user { flex-direction: row-reverse }
.msg-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: linear-gradient(135deg, var(--cyan), #0099cc);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; flex-shrink: 0; margin-top: 2px;
}
.msg.user .msg-avatar { background: linear-gradient(135deg, #6366f1, #8b5cf6) }
.msg-bubble {
  max-width: 78%;
  padding: 10px 13px;
  border-radius: 14px;
  font-size: 13px;
  line-height: 1.55;
  color: var(--white);
}
.msg.bot .msg-bubble { background: var(--bg3); border-bottom-left-radius: 4px }
.msg.user .msg-bubble { background: linear-gradient(135deg, #00b4a0, #0099cc); border-bottom-right-radius: 4px }

.typing { display: flex; align-items: center; gap: 4px; padding: 10px 13px; background: var(--bg3); border-radius: 14px; border-bottom-left-radius: 4px; width: fit-content }
.typing span { width: 6px; height: 6px; background: var(--muted); border-radius: 50%; animation: bounce .8s infinite }
.typing span:nth-child(2) { animation-delay: .15s }
.typing span:nth-child(3) { animation-delay: .3s }
@keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }

.quick-options {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 0 16px 10px;
}
.quick-btn {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 6px 12px;
  font-size: 12px;
  color: var(--cyan);
  cursor: pointer;
  transition: .15s;
  font-family: inherit;
}
.quick-btn:hover { background: var(--bg4); border-color: rgba(0,229,200,0.3) }

.chat-input-area {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  align-items: flex-end;
  background: var(--bg2);
  flex-shrink: 0;
}
.chat-input {
  flex: 1;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 9px 14px;
  font-size: 13px;
  color: var(--white);
  font-family: inherit;
  outline: none;
  resize: none;
  max-height: 80px;
  transition: .15s;
  line-height: 1.4;
}
.chat-input:focus { border-color: rgba(0,229,200,0.3) }
.chat-input::placeholder { color: var(--muted) }
.chat-send {
  width: 36px; height: 36px;
  background: var(--cyan);
  border: none; border-radius: 50%;
  cursor: pointer; display: flex;
  align-items: center; justify-content: center;
  flex-shrink: 0; transition: .15s;
}
.chat-send:hover { opacity: .85 }
.chat-send:disabled { opacity: .4; cursor: default }
.chat-send svg { width: 16px; height: 16px; fill: #000 }
</style>
</head>
<body>

<div class="test-page">

  <p>Horaires : Lundi–Samedi, 9h–18h</p>

  <p style="color:#999;font-size:13px">💬 Cliquez sur le bouton en bas à droite pour discuter avec notre assistante IA.</p>
</div>

<div id="chatBadge">Bonjour ! 👋</div>

<div id="chatWindow">

    <div class="chat-avatar">🐾</div>

    <button class="chat-send" id="sendBtn" onclick="sendUserMessage()">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
// ── CONFIG ──────────────────────────────────────────────
const N8N_WEBHOOK = 'https://jeffpe96.app.n8n.cloud/webhook/maina-agencia-poil';
const CLAUDE_SYSTEM_PROMPT = `Tu es Maïna, l'assistante virtuelle chaleureuse et professionnelle du salon de toilettage AgencIA du Poil à Annecy. Tu communiques par CHAT ÉCRIT. Tu adores les animaux et tu mets les clients à l'aise immédiatement. Tu parles uniquement en français, avec un ton doux, rassurant et naturel. Tu es concise et poses une seule question à la fois.

SALON

CHATS

DURÉES serviceDuration en minutes :

CLÔTURE TARIFAIRE OBLIGATOIRE
Toujours terminer une estimation par : "Le tarif définitif sera confirmé par le toiletteur lors de l'examen de l'animal au salon, notamment en cas de nœuds importants ou de comportement difficile."

LOGIQUE D'UPSELL NATURELLE
Si le client demande un bain seul ou une tonte seule : mentionne une seule fois, de façon naturelle et non insistante, que le service complet inclut ces services plus le brossage/griffes/oreilles pour X€ de plus. Si le client décline, accepte sans insister.
Si le client demande juste une coupe des griffes : ne propose pas d'upsell, c'est un service rapide indépendant.

GESTION DES RENDEZ-VOUS

2. Demander le service souhaité
3. Déterminer serviceDuration selon les tableaux ci-dessus
4. Demander le jour et l'heure préférés

6. Si disponible : collecter nom complet propriétaire, nom animal, informations importantes (allergies, comportement — "Aucune" si rien), numéro de téléphone

Pour MODIFIER un RDV :

2. Appeler chercher_rdv pour trouver ses rendez-vous

Pour ANNULER un RDV :

✂️ Service : [service exact]

OUTILS DISPONIBLES

Pour modifier :
{"tool": "modifier_rendez_vous", "name_caller": "...", "name_animal": "...", "old_date_Time": "...", "new_date_Time": "...", "chosen_service": "Service complet - Grand (L)", "serviceDuration": 150}
Note: toujours inclure chosen_service avec la catégorie et serviceDuration exact.

Pour annuler :
{"tool": "annuler_rendez_vous", "name_caller": "...", "name_animal": "...", "date_Time": "..."}

RÈGLES IMPORTANTES
- Ne jamais inventer une disponibilité sans appeler verifier_disponibilite
- Ne jamais enregistrer un RDV sans tous les champs obligatoires
- Quand tu dois appeler un outil, réponds UNIQUEMENT avec le JSON (pas de texte avant ou après)
- Après avoir reçu le résultat d'un outil, réponds naturellement en français
- Si un outil échoue, dire "J'ai un petit souci technique, laissez-moi réessayer" et réessayer une fois

DATE ACTUELLE : ${new Date().toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long', year:'numeric'})} | DATE ISO : ${new Date().toISOString().split('T')[0]} | JOUR JS : ${new Date().getDay()} (0=dim,6=sam) - Utilise la DATE ISO pour calculer les prochains jours exactement.`;

// ── STATE ────────────────────────────────────────────────
let chatOpen = false;
let conversationHistory = [];
let isProcessing = false;

// ── TOGGLE ───────────────────────────────────────────────
function toggleChat() {
  chatOpen = !chatOpen;
  const win = document.getElementById('chatWindow');
  const btn = document.getElementById('chatBtn');
  const badge = document.getElementById('chatBadge');
  if (chatOpen) {
    win.classList.add('open');
    btn.classList.add('open');
    btn.textContent = '✕';
    badge.style.display = 'none';
    if (conversationHistory.length === 0) startConversation();
    setTimeout(() => document.getElementById('chatInput').focus(), 300);
  } else {
    win.classList.remove('open');
    btn.classList.remove('open');
    btn.textContent = '💬';
  }
}

setTimeout(() => {
  if (!chatOpen) document.getElementById('chatBadge').style.display = 'block';
}, 3000);

// ── MESSAGES UI ───────────────────────────────────────────
function renderMarkdown(text) {
  return text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}

function isRecapitulatif(text) {
  return text.includes('📋') && text.includes('📅') && text.includes('Confirmez-vous');
}

function renderRecap(text, sender) {
  const msgs = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'msg ' + sender;
  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.textContent = '🐾';
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.style.maxWidth = '90%';
  bubble.style.padding = '0';
  bubble.style.background = 'transparent';

  // Parse recap lines
  const lines = text.split('\n').filter(function(l){return l.trim();});
  const titleLine = lines.find(l => l.includes('📋')) || '';
  const dataLines = lines.filter(l => /[📅🐾✂️💶👤📞⚠️]/.test(l) && !l.includes('📋'));
  const confirmLine = lines.find(l => l.includes('Confirmez-vous')) || '';
  const noteLine = lines.find(l => l.includes('* Tarif')) || '';

  let html = '<div style="background:var(--bg3);border:1px solid rgba(0,229,200,0.2);border-radius:14px;overflow:hidden">'
    + '<div style="background:rgba(0,229,200,0.08);padding:10px 14px;font-size:12px;font-weight:700;color:var(--cyan);border-bottom:1px solid rgba(0,229,200,0.15)">' + titleLine.trim() + '</div>'
    + '<div style="padding:10px 14px">';
  
  dataLines.forEach(function(line) {
    var parts = line.split(':');
    if (parts.length >= 2) {
      var label = parts[0].trim();
      var value = parts.slice(1).join(':').trim();
      html += '<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(255,255,255,0.05);font-size:12px">'
        + '<span style="color:var(--muted)">' + label + '</span>'
        + '<span style="color:var(--white);font-weight:600;text-align:right;max-width:60%">' + value + '</span>'
        + '</div>';
    }
  });

  if (noteLine) {
    html += '<div style="font-size:10px;color:var(--muted);margin-top:6px">' + noteLine + '</div>';
  }

  html += '</div>'
    + '<div style="padding:10px 14px;border-top:1px solid rgba(255,255,255,0.05)">'
    + '<div style="font-size:12px;color:var(--white);margin-bottom:8px">' + confirmLine + '</div>'
    + '<div style="display:flex;gap:8px">'
    + '<button onclick="confirmRecap(this)" style="flex:1;background:var(--cyan);border:none;border-radius:8px;padding:8px;font-size:12px;font-weight:700;color:#000;cursor:pointer;font-family:inherit">✅ Confirmer</button>'
    + '<button onclick="cancelRecap(this)" style="flex:1;background:var(--bg4);border:1px solid var(--border);border-radius:8px;padding:8px;font-size:12px;color:var(--white);cursor:pointer;font-family:inherit">❌ Modifier</button>'
    + '</div></div></div>';

  bubble.innerHTML = html;
  div.appendChild(avatar);
  div.appendChild(bubble);
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function confirmRecap(btn) {
  if (btn.disabled) return;
  btn.disabled = true;
  btn.textContent = '⏳ En cours...';
  btn.style.background = 'var(--muted)';
  const cancelBtn = btn.closest('.msg').querySelector('button:last-child');
  if (cancelBtn) cancelBtn.disabled = true;
  addMsg('✅ Confirmer', 'user');
  // Store reference to update button after confirmation
  window._pendingConfirmBtn = btn;
  processUserMessage('Je confirme');
}

function cancelRecap(btn) {
  addMsg('❌ Modifier', 'user');
  processUserMessage('Je souhaite modifier');
}

function addMsg(text, sender) {
  if (sender === 'bot' && isRecapitulatif(text)) {
    renderRecap(text, sender);
    return;
  }
  const msgs = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'msg ' + sender;
  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.textContent = sender === 'bot' ? '🐾' : '👤';
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  if (sender === 'bot') {
    bubble.innerHTML = renderMarkdown(text);
  } else {
    bubble.textContent = text;
  }
  div.appendChild(avatar);
  div.appendChild(bubble);
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function showTyping() {
  const msgs = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.id = 'typingIndicator';
  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.textContent = '🐾';
  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.innerHTML = '<span></span><span></span><span></span>';
  div.appendChild(avatar);
  div.appendChild(typing);
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function hideTyping() {
  const t = document.getElementById('typingIndicator');
  if (t) t.remove();
}

function setQuickOptions(opts) {
  const el = document.getElementById('quickOptions');
  el.innerHTML = '';
  opts.forEach(o => {
    const btn = document.createElement('button');
    btn.className = 'quick-btn';
    btn.textContent = o;
    btn.onclick = () => {
      el.innerHTML = '';
      addMsg(o, 'user');
      processUserMessage(o);
    };
    el.appendChild(btn);
  });
}

// ── CLAUDE API ────────────────────────────────────────────
async function callClaude(userMessage) {
  conversationHistory.push({ role: 'user', content: userMessage });

  const response = await fetch('https://jeffpe96.app.n8n.cloud/webhook/chatbot-claude', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-haiku-4-5',
      max_tokens: 1000,
      system: CLAUDE_SYSTEM_PROMPT,
      messages: conversationHistory
    })
  });

  const data = await response.json();
  const assistantText = data.content?.[0]?.text || '';
  conversationHistory.push({ role: 'assistant', content: assistantText });
  return assistantText;
}

// ── N8N TOOLS ─────────────────────────────────────────────
async function callN8nTool(toolData) {
  const toolName = toolData.tool;
  delete toolData.tool;

  // chercher_rdv uses a different webhook
  if (toolName === 'chercher_rdv') {
    const name = encodeURIComponent(toolData.name || '');
    const res = await fetch('https://jeffpe96.app.n8n.cloud/webhook/rdv-client?name=' + name);
    return await res.json();
  }

  const res = await fetch(N8N_WEBHOOK, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ToolCallName: toolName, ...toolData })
  });
  return await res.json();
}

// ── PARSE TOOL CALL ───────────────────────────────────────
function parseToolCall(text) {
  try {
    const trimmed = text.trim();
    if (trimmed.startsWith('{') && trimmed.includes('"tool"')) {
      return JSON.parse(trimmed);
    }
    // Try to extract JSON from text
    const match = trimmed.match(/\{[\s\S]*"tool"[\s\S]*\}/);
    if (match) return JSON.parse(match[0]);
  } catch(e) {}
  return null;
}

// ── PROCESS MESSAGE ───────────────────────────────────────
async function processUserMessage(userMsg) {
  if (isProcessing) return;
  isProcessing = true;
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('quickOptions').innerHTML = '';

  try {
    showTyping();
    let claudeResponse = await callClaude(userMsg);
    hideTyping();

    // Check if Claude wants to call a tool
    const toolCall = parseToolCall(claudeResponse);
    
    if (toolCall) {
      // Execute tool
      showTyping();
      let toolResult;
      try {
        toolResult = await callN8nTool(toolCall);
      } catch(e) {
        toolResult = { error: 'Tool call failed' };
      }
      hideTyping();

      // Send tool result back to Claude
      const toolResultMsg = 'Résultat de l\'outil : ' + JSON.stringify(toolResult);
      showTyping();
      claudeResponse = await callClaude(toolResultMsg);
      hideTyping();

      // Check if Claude wants to call another tool (ex: after verifier -> reserver)
      const toolCall2 = parseToolCall(claudeResponse);
      if (toolCall2) {
        showTyping();
        let toolResult2;
        try {
          toolResult2 = await callN8nTool(toolCall2);
        } catch(e) {
          toolResult2 = { error: 'Tool call failed' };
        }
        hideTyping();
        showTyping();
        claudeResponse = await callClaude('Résultat : ' + JSON.stringify(toolResult2));
        hideTyping();
      }
    }

    addMsg(claudeResponse, 'bot');

    // Update confirm button if pending
    if (window._pendingConfirmBtn) {
      window._pendingConfirmBtn.textContent = '✅ Confirmé !';
      window._pendingConfirmBtn.style.background = 'var(--green)';
      window._pendingConfirmBtn.style.color = '#000';
      window._pendingConfirmBtn = null;
    }

    // Show quick options based on context
    if (conversationHistory.length <= 2) {
      setQuickOptions(['Prendre un rendez-vous 📅', 'Modifier un rendez-vous ✏️', 'Annuler un rendez-vous ❌', 'Questions sur les tarifs 💶']);
    }

  } catch(e) {
    hideTyping();
    addMsg('J\'ai un petit souci technique. Pouvez-vous réessayer ?', 'bot');
    console.error('Error:', e);
  }

  isProcessing = false;
  document.getElementById('sendBtn').disabled = false;
}

// ── START ─────────────────────────────────────────────────
async function startConversation() {
  showTyping();
  await new Promise(r => setTimeout(r, 600));
  hideTyping();
  addMsg('Bonjour et bienvenue chez AgencIA du Poil ! 😊 Je suis Maïna, votre assistante. Je peux vous aider à prendre, modifier ou annuler un rendez-vous, ou répondre à vos questions. Comment puis-je vous aider ?', 'bot');
  conversationHistory.push({
    role: 'assistant',
    content: 'Bonjour et bienvenue chez AgencIA du Poil ! 😊 Je suis Maïna, votre assistante. Je peux vous aider à prendre, modifier ou annuler un rendez-vous, ou répondre à vos questions. Comment puis-je vous aider ?'
  });
  setQuickOptions(['Prendre un rendez-vous 📅', 'Modifier un rendez-vous ✏️', 'Annuler un rendez-vous ❌', 'Questions sur les tarifs 💶']);
}

// ── INPUT ─────────────────────────────────────────────────
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendUserMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 80) + 'px';
}

function sendUserMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text || isProcessing) return;
  input.value = '';
  input.style.height = 'auto';
  document.getElementById('quickOptions').innerHTML = '';
  addMsg(text, 'user');
  processUserMessage(text);
}
